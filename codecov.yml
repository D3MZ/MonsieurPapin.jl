coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: false

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false

ignore:
  - "deps/**"
  - "docs/**"
  - "test/**"
  - "tmp/**"
  - "data/**"